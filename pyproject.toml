[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "real-estate-agent"
version = "0.1.0"
description = "Tools for working with Dubai real estate transaction data."
requires-python = ">=3.12"
dependencies = [
    "pandas",
    "reportlab",
    "beautifulsoup4",
    "markdownify",
    "SQLAlchemy>=2.0,<3.0",
    "psycopg[binary]>=3.2,<4.0",
]

[project.scripts]
create-tables = "scripts.create_tables:main"
seed-transactions = "scripts.seed_transactions:main"
process-data = "data.scripts.process:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app", "app.*", "scripts", "scripts.*", "data", "data.scripts", "data.scripts.*"]
namespaces = false
